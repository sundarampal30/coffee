
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coffee Cafe</title>

    <!-- Boxicons -->
    <link
        href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- ================= LOGIN FORM ================= -->

    <div class="form-box login">

        <form id="loginForm">

            <h1>Login</h1>

            <div class="input-box">
                <input
                    type="text"
                    id="loginUsername"
                    placeholder="Username"
                    required>

                <i class="bx bxs-user"></i>
            </div>

            <div class="input-box">
                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                    required>

                <i class="bx bxs-lock-alt"></i>
            </div>

            <div class="forget-password">
                <a href="#" id="forgotPassword">
                    Forgot Password?
                </a>
            </div>

            <button type="submit" class="button">
                Login
            </button>

            <p>
                Don't have an account?
                <a href="#" class="register-link">
                    Signup
                </a>
            </p>


            <!-- SOCIAL LOGIN -->

            <div class="social-login">

                <p>Or Login With</p>

                <div class="social-icons">

                    <a href="https://accounts.google.com/" target="_blank">
                        <i class="bx bxl-google"></i>
                        Google
                    </a>

                    <a href="https://github.com/login" target="_blank">
                        <i class="bx bxl-github"></i>
                        GitHub
                    </a>

                    <a href="https://www.facebook.com/login/" target="_blank">
                        <i class="bx bxl-facebook"></i>
                        Facebook
                    </a>

                    <a href="mailto:">
                        <i class="bx bx-envelope"></i>
                        Email
                    </a>

                    <a href="tel:">
                        <i class="bx bx-phone"></i>
                        Mobile
                    </a>

                </div>

            </div>

        </form>

    </div>


    <!-- ================= REGISTER FORM ================= -->

    <div class="form-box register">

        <form id="registerForm">

            <h1>Register</h1>

            <div class="input-box">
                <input
                    type="text"
                    id="registerUsername"
                    placeholder="Username"
                    required>

                <i class="bx bxs-user"></i>
            </div>

            <div class="input-box">
                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Email"
                    required>

                <i class="bx bx-envelope"></i>
            </div>

            <div class="input-box">
                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Password"
                    required>

                <i class="bx bxs-lock-alt"></i>
            </div>

            <div class="input-box">
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm Password"
                    required>

                <i class="bx bxs-lock-alt"></i>
            </div>

            <button type="submit" class="button">
                Register
            </button>

            <p>
                Already have an account?
                <a href="#" class="login-link">
                    Login
                </a>
            </p>


            <!-- SOCIAL REGISTER -->

            <div class="social-login">

                <p>Or Register With</p>

                <div class="social-icons">

                    <a href="https://accounts.google.com/" target="_blank">
                        <i class="bx bxl-google"></i>
                        Google
                    </a>

                    <a href="https://github.com/login" target="_blank">
                        <i class="bx bxl-github"></i>
                        GitHub
                    </a>

                    <a href="mailto:">
                        <i class="bx bx-envelope"></i>
                        Email
                    </a>

                    <a href="tel:">
                        <i class="bx bx-phone"></i>
                        Mobile
                    </a>

                </div>

            </div>

        </form>

    </div>


    <!-- ================= TOGGLE BOX ================= -->

    <div class="toggle-box">

        <div class="toggle-panel toggle-left">

            <h1>Hello, Welcome!</h1>

            <p>
                Don't have an account?
            </p>

            <button
                type="button"
                class="button register-link">
                Signup
            </button>

        </div>


        <div class="toggle-panel toggle-right">

            <h1>Welcome Back!</h1>

            <p>
                Already have an account?
            </p>

            <button
                type="button"
                class="button login-link">
                Login
            </button>

        </div>

    </div>

</div>


<!-- JavaScript -->

<script src="script.js"></script>

</body>

</html>
